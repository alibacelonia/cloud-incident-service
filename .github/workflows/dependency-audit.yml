name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv export --locked --all-extras --all-groups --no-emit-project --format requirements.txt --output-file "$RUNNER_TEMP/audit-requirements.txt" --quiet
      - run: uvx pip-audit==2.10.0 --requirement "$RUNNER_TEMP/audit-requirements.txt" --disable-pip --no-deps --strict
