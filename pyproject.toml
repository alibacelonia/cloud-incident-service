[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloud-incident-service"
version = "0.1.0"
description = "AI-assisted AWS incident investigation service"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "boto3>=1.37,<2",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["httpx2>=2.15,<3", "pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloud_incident_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call Amazon Bedrock; they are deselected unless run with `-m live` (NFR-3).
addopts = "-m 'not live'"
markers = ["live: calls Amazon Bedrock; opt-in with RUN_LIVE_TESTS=1 and `pytest -m live`"]
# Starlette deprecations (for example its TestClient HTTP backend) fail the suite (M-01).
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[dependency-groups]
dev = [
    "httpx2>=2.15,<3",
    "pytest>=9.1.1",
]

